<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reconocimiento Facial - VIGIA IA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/reconocimiento.css">
    <style>
    .video-container { position: relative; width: 640px; height: 480px; margin: 0 auto; border-radius: 12px; overflow: hidden; border: 2px solid #00E5FF; box-shadow: 0 0 30px rgba(0,229,255,0.3); }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #status { font-family: 'Poppins', sans-serif; text-align: center; margin-top: 20px; font-size: 1.2rem; font-weight: 600; }
    .status-ok { color: #00FFB2; }
    .status-err { color: #FF3B5C; }
    </style>

</head>

<body class="dashboard-body">
    <div class="dashboard-layout">
        <aside class="sidebar">... (copia el sidebar de personal.html aquí) ...</aside>
        <main class="main-content">
            <header class="topbar">
                <h1 class="topbar-title">Control de Acceso Biométrico</h1>
            </header>
            <div class="panel" style="padding: 2rem; text-align: center;">
                <div class="video-container">
                    <video id="video" autoplay muted playsinline></video>
                    <canvas id="overlay"></canvas>
                </div>
                <div id="status">Cargando modelos de IA...</div>
                <button class="btn-secondary-vigia mt-3" onclick="toggleCamera()">
                    <i class="bi bi-camera-video"></i> <span id="btnText">Detener Cámara</span>
                </button>
            </div>
        </main>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/reconocimiento.js"></script>
</body>
</html>
